<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cart Saver</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="cmcs-root">
    <main class="page">
      <header class="top">
        <img class="logo" src="../../icons/icon48.png" alt="" />
        <div>
          <h1>Cart Saver</h1>
          <p class="cmcs-muted" data-i18n="extDescription"></p>
        </div>
      </header>

      <section class="card">
        <h2 data-i18n="settingsTitle"></h2>
        <label class="row">
          <input type="checkbox" id="autoTrack" />
          <span>
            <strong data-i18n="settingAutoTrack"></strong>
            <span class="cmcs-muted" data-i18n="settingAutoTrackHelp"></span>
          </span>
        </label>
        <label class="row">
          <input type="checkbox" id="showReminder" />
          <span>
            <strong data-i18n="settingReminder"></strong>
            <span class="cmcs-muted" data-i18n="settingReminderHelp"></span>
          </span>
        </label>
        <label class="row row--input">
          <span>
            <strong data-i18n="settingDelay"></strong>
            <span class="cmcs-muted" data-i18n="settingDelayHelp"></span>
          </span>
          <input type="number" id="delay" min="0.5" max="10" step="0.1" />
        </label>
        <p id="saved" class="cmcs-muted saved" aria-live="polite"></p>
      </section>

      <section class="card">
        <h2 data-i18n="dataTitle"></h2>
        <p id="dataSummary" class="cmcs-muted"></p>
        <div class="buttons">
          <button type="button" class="cmcs-btn cmcs-btn--ghost" id="export" data-i18n="exportData"></button>
          <label class="cmcs-btn cmcs-btn--ghost">
            <span data-i18n="importData"></span>
            <input type="file" id="import" accept="application/json,.json" hidden />
          </label>
          <button type="button" class="cmcs-btn cmcs-btn--danger" id="clear" data-i18n="clearAll"></button>
        </div>
        <p id="dataMessage" class="cmcs-muted" aria-live="polite"></p>
      </section>

      <section class="card">
        <h2 data-i18n="howTitle"></h2>
        <ol class="how">
          <li data-i18n="how1"></li>
          <li data-i18n="how2"></li>
          <li data-i18n="how3"></li>
          <li data-i18n="how4"></li>
          <li data-i18n="how5"></li>
        </ol>
        <p class="cmcs-muted" data-i18n="privacyNote"></p>
      </section>
    </main>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/store.js"></script>
    <script src="../shared/ui.js"></script>
    <script src="options.js"></script>
  </body>
</html>
