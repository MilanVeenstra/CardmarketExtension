<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cart Saver</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="cmcs-root">
    <header class="top">
      <span id="brand"></span>
      <span class="spacer"></span>
      <select id="game" class="game" hidden aria-label="Spel"></select>
      <a id="options" class="cmcs-icon-btn" href="#" data-i18n-title="settings"></a>
    </header>

    <nav class="tabs" role="tablist">
      <button type="button" id="tab-cart" class="tab" role="tab" aria-controls="view-cart" data-i18n="tabCart"></button>
      <button type="button" id="tab-fav" class="tab" role="tab" aria-controls="view-fav"></button>
      <button type="button" id="tab-carts" class="tab" role="tab" aria-controls="view-carts"></button>
    </nav>

    <main>
      <section id="job" class="job" hidden></section>
      <p id="notice" class="notice" hidden></p>

      <div id="view-cart" role="tabpanel" aria-labelledby="tab-cart">
        <section id="summary" class="cmcs-summary"></section>
        <nav id="refill-games" class="cmcs-chips" hidden></nav>
        <section id="list" class="list"></section>
        <section id="export" class="export" hidden>
          <button type="button" id="export-text" class="cmcs-link" data-i18n="exportCopy"></button>
          <button type="button" id="export-csv" class="cmcs-link" data-i18n="exportCsv"></button>
        </section>
        <section id="empty" class="empty" hidden>
          <p class="empty-title" data-i18n="emptyTitle"></p>
          <p class="cmcs-muted" data-i18n="emptyLead"></p>
          <a class="cmcs-btn" href="https://www.cardmarket.com/en/Magic/ShoppingCart" target="_blank" data-i18n="openCardmarket"></a>
        </section>
      </div>

      <div id="view-fav" role="tabpanel" aria-labelledby="tab-fav" hidden>
        <input id="fav-search" class="search" type="search" autocomplete="off" data-i18n-placeholder="favSearch" />
        <section id="fav-list" class="list"></section>
        <section id="fav-empty" class="empty" hidden>
          <p class="empty-title" data-i18n="favEmptyTitle"></p>
          <p class="cmcs-muted" data-i18n="favEmptyLead"></p>
        </section>
      </div>

      <div id="view-carts" role="tabpanel" aria-labelledby="tab-carts" hidden>
        <form id="cart-form" class="cart-form">
          <input id="cart-name" class="search" type="text" maxlength="80" autocomplete="off" data-i18n-placeholder="cartsNamePlaceholder" />
          <button type="submit" class="cmcs-btn" data-i18n="cartsSave"></button>
        </form>
        <section id="carts-list" class="list"></section>
        <section id="carts-empty" class="empty" hidden>
          <p class="empty-title" data-i18n="cartsEmptyTitle"></p>
          <p class="cmcs-muted" data-i18n="cartsEmptyLead"></p>
        </section>
      </div>

      <p class="privacy" data-i18n="privacyNote"></p>
    </main>

    <footer id="foot" class="foot" hidden></footer>
    <div id="toast" class="toast" role="status" hidden></div>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/store.js"></script>
    <script src="../shared/ui.js"></script>
    <script src="../content/cardmarket.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
